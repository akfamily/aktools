# commit setup
# 让 pre-commit install 同时安装提交前检查与提交信息检查两个钩子；
# 否则只运行 pre-commit install 时，commit-msg 阶段的 conventional-pre-commit 不会生效。
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-case-conflict
      - id: detect-private-key
  - repo: local
    hooks:
      # ruff 版本的唯一来源是 pyproject.toml 的 lint 组（经 uv.lock 锁定），
      # 这里与 CI 的 lint job 跑同一条命令，不存在第二处版本号需要同步。
      # --locked 会在改过 pyproject.toml 却漏跑 uv lock 时直接失败，
      # 把 CI 安装步骤的报错提前到提交时。
      # --force-exclude 必需：pre-commit 传入显式文件名时，
      # ruff 默认不再套用自身配置里的 exclude。
      - id: ruff-check
        name: ruff check
        entry: uv run --locked --only-group lint ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --locked --only-group lint ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []
