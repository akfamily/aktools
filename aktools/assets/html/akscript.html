<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKTools PyScript 数据展示</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.11.1/core.css"/>
    <script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>
    <style>
        body {
            font-family: Arial, "Microsoft YaHei", sans-serif;
            margin: 1.5rem;
        }

        h1 {
            text-align: center;
            font-size: 1.3rem;
        }

        #download {
            text-align: center;
            margin: 1rem 0;
        }

        #download a {
            color: #c0392b;
        }

        #table {
            overflow-x: auto;
        }

        .mystyle {
            margin: 0 auto;
            font-size: 11pt;
            font-family: Arial, sans-serif;
            border-collapse: collapse;
            border: 1px solid silver;
        }

        .mystyle td, .mystyle th {
            padding: 5px;
        }

        .mystyle tr:nth-child(even) {
            background: #e0e0e0;
        }

        .mystyle tr:hover {
            background: silver;
            cursor: pointer;
        }
    </style>
</head>
<body>
<h1>利用 PyScript 在浏览器运行 AKShare 实现数据展示及下载功能</h1>

<div id="download">
    <a href="http://{{ ip }}/api/public/{{ interface }}" download="{{ interface }}.json">点击下载</a>
</div>

<div id="table">数据加载中……</div>

<script type="py" config='{"packages": ["pandas"]}'>
    import io

    import pandas as pd
    from pyscript import HTML, display, fetch

    # 本地 AKTools 服务提供的数据接口
    url = "http://{{ ip }}/api/public/{{ interface }}"

    text = await fetch(url).text()
    temp_df = pd.read_json(io.StringIO(text))
    display(HTML(temp_df.to_html(classes="mystyle")), target="table", append=False)
</script>
</body>
</html>
