# release_and_deploy
name: release and deploy

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 绑定到 pypi environment，与 PyPI 上 trusted publisher 的 environment 配置一致
    environment: pypi
    permissions:
      # Trusted Publishing 通过 OIDC 换取 PyPI 上传凭证，无需任何 token/密码
      id-token: write
      # 创建 GitHub Release 需要写 contents；一旦显式声明 permissions，
      # 未列出的权限即为 none，故必须显式给出
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # 必须在 build 与 upload 之前：PyPI 的版本号一经占用即不可重用，
      # 发错版本号无法撤回，只能改用下一个号。
      # 脚本只依赖标准库，因此放在安装依赖之前也能跑。
      - name: Verify release metadata
        run: python scripts/check_release.py "${{ github.ref_name }}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      # 上一步校验的是仓库内的版本声明，这一步校验真正要上传的产物文件名。
      # 两者分开是有意的：构建后端若取错版本号，只有看产物才能发现。
      - name: Verify built artifacts carry the tagged version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "期望版本: ${version}"
          ls -1 dist/
          for f in dist/*; do
            case "$(basename "$f")" in
              aktools-${version}-*.whl|aktools-${version}.tar.gz) ;;
              *) echo "[release] 产物 $(basename "$f") 与 tag 版本 ${version} 不匹配"; exit 1 ;;
            esac
          done
          twine check dist/*

      # Trusted Publishing：通过 OIDC 直接发布，不使用 twine upload，也不需要 secret
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      # 放在发布之后：上传失败时不会留下没有对应 PyPI 版本的 GitHub Release。
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # 登记到 MCP 官方注册表（registry.modelcontextprotocol.io），各 MCP 客户端的市场据此收录 AKTools。
  # 单独成一个 job：登记失败不影响已完成的 PyPI 发布与 GitHub Release，修复后可单独重跑本 job。
  # 注册表会到 PyPI 读取本版本的项目说明，核对其中的 mcp-name 标记，因此必须在 PyPI 发布之后运行。
  # 见 https://modelcontextprotocol.io/registry/github-actions
  publish-mcp-registry:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      # 通过 OIDC 证明本仓库属于 akfamily，从而获得 io.github.akfamily/* 命名空间，无需任何 secret
      id-token: write
      contents: read
    env:
      # 升级时同步修改；下载的二进制会用 cosign 校验签名
      MCP_PUBLISHER_VERSION: v1.8.6
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      # PyPI 刚发布时，新版本的项目说明可能要过一会儿才能被读取，失败时等待后重试
      - name: Publish server to MCP Registry
        run: |
          for attempt in 1 2 3 4 5; do
            if ./mcp-publisher publish server.json; then
              exit 0
            fi
            echo "第 ${attempt} 次登记失败，60 秒后重试"
            sleep 60
          done
          exit 1
