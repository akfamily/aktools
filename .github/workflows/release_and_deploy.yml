# release_and_deploy
name: release and deploy

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 绑定到 pypi environment，与 PyPI 上 trusted publisher 的 environment 配置一致
    environment: pypi
    permissions:
      # Trusted Publishing 通过 OIDC 换取 PyPI 上传凭证，无需任何 token/密码
      id-token: write
      # 创建 GitHub Release 需要写 contents；一旦显式声明 permissions，
      # 未列出的权限即为 none，故必须显式给出
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # 必须在 build 与 upload 之前：PyPI 的版本号一经占用即不可重用，
      # 发错版本号无法撤回，只能改用下一个号。
      # 脚本只依赖标准库，因此放在安装依赖之前也能跑。
      - name: Verify release metadata
        run: python scripts/check_release.py "${{ github.ref_name }}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      # 上一步校验的是仓库内的版本声明，这一步校验真正要上传的产物文件名。
      # 两者分开是有意的：构建后端若取错版本号，只有看产物才能发现。
      - name: Verify built artifacts carry the tagged version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "期望版本: ${version}"
          ls -1 dist/
          for f in dist/*; do
            case "$(basename "$f")" in
              aktools-${version}-*.whl|aktools-${version}.tar.gz) ;;
              *) echo "[release] 产物 $(basename "$f") 与 tag 版本 ${version} 不匹配"; exit 1 ;;
            esac
          done
          twine check dist/*

      # Trusted Publishing：通过 OIDC 直接发布，不使用 twine upload，也不需要 secret
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      # 放在发布之后：上传失败时不会留下没有对应 PyPI 版本的 GitHub Release。
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
