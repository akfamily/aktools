# build（名称保留不改，README 的状态徽章引用了它）
name: build

# 只改文档时不跑测试矩阵（16 个任务，含排队较慢的 macOS）；文档站由 Read the Docs 单独构建。
# README.md 与 docs/aktools_version.md 不能跳过：前者是 PyPI 项目说明并含 MCP 注册表的归属标记，
# 后者与版本号的一致性都有测试把关。后写的 ! 规则会覆盖前面的忽略规则
on:
  push:
    branches:
      - main
    paths-ignore: &docs-only
      - "docs/**"
      - "!docs/aktools_version.md"
      - "mkdocs.yml"
      - ".readthedocs.yaml"
      - "CLAUDE.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
  pull_request:
    branches:
      - main
    paths-ignore: *docs-only

env:
  # 与本地开发使用的 uv 版本保持一致，避免"本地通过、CI 失败"。
  # 升级时请连同开发者本地的 uv 一起升，并重新生成 uv.lock；
  # .readthedocs.yaml 中 pip install uv== 的版本号也要同步修改。
  UV_VERSION: "0.13.6"

# 两个 job 相互独立并行，任何一个失败都不阻塞另一个的反馈。
# astral-sh/setup-uv 自 v8 起不再发布浮动大版本标签，必须写完整版本号，
# 由 Dependabot 的 github-actions 生态负责跟进升级。
jobs:
  # 代码风格与静态检查与平台、Python 版本无关，单独跑一次即可。
  # --only-group lint 仅安装 ruff，不装 aktools 本体；ruff 版本由 uv.lock 锁定。
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install locked lint toolchain
        run: uv sync --locked --only-group lint

      - name: Lint with Ruff
        run: |
          uv run --locked --only-group lint ruff format --check .
          uv run --locked --only-group lint ruff check .

  # 用 --locked 而非 --frozen：改了 pyproject.toml 却忘记重新 lock 时会直接失败，
  # 依赖声明与锁文件脱节因此不可能进入主干。
  # --no-default-groups：dev 是 PEP 735 的默认组，不排除的话会装上 pre-commit 等工具。
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install locked dependencies
        run: uv sync --locked --no-default-groups --group test

      - name: Test with pytest
        run: uv run --locked --no-default-groups --group test pytest
