[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aktools"
dynamic = ["version"]
description = "AKTools is a tool for AKShare HTTP API!"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "AKFamily", email = "albertandking@gmail.com"}
]
keywords = [
    "stock",
    "option",
    "futures",
    "bond",
    "index",
    "air",
    "others",
    "finance",
    "spider",
    "quant",
    "quantitative",
    "investment",
    "trading",
    "algotrading",
]
classifiers = [
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "akshare>=1.16.25",
    "fastapi>=0.115.5",
    "uvicorn>=0.16.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.2",
    "typer[standard]>=0.6.1",
]

[project.urls]
Homepage = "https://github.com/akfamily/aktools"

[tool.setuptools.dynamic]
# 版本号的唯一来源是 aktools/__init__.py 中的 __version__
version = {attr = "aktools.__version__"}

[tool.setuptools.packages.find]
# 只打包 aktools，避免把 tests 作为顶层包装进 site-packages
include = ["aktools*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.pk", "*.woff", "*.html", "*.ico"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    "aktools/__init__.py",  # 初始化导入库文件，必须包含本文件
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.12
target-version = "py312"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"
